
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Visual Gallery</h1>
        <p>Interactive Image Gallery & Automatic Slideshow</p>
    </header>

    <!-- Automatic Slideshow -->

    <section class="slideshow-section">

        <h2>Featured Images</h2>

        <div class="slideshow">

            <img id="slideImage"
                 src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200"
                 alt="Mountain landscape">

            <button class="slide-button previous"
                    id="previousSlide">❮</button>

            <button class="slide-button next"
                    id="nextSlide">❯</button>

            <div class="slide-caption" id="slideCaption">
                Mountain Landscape
            </div>

        </div>

        <div class="slideshow-controls">
            <button id="playPauseButton">Pause Slideshow</button>
        </div>

    </section>

    <!-- Image Gallery -->

    <section class="gallery-section">

        <h2>Explore Our Gallery</h2>

        <p>Click any image to view it in a larger format.</p>

        <div class="gallery">

            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 alt="Mountain landscape"
                 data-full="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400">

            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                 alt="Beautiful lake"
                 data-full="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1400">

            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
                 alt="Mountain and lake"
                 data-full="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1400">

            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
                 alt="Sunrise landscape"
                 data-full="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1400">

            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                 alt="Green forest"
                 data-full="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1400">

            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600"
                 alt="Ocean waves"
                 data-full="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1400">

        </div>

    </section>

    <!-- Enlarged Image Preview -->

    <div class="lightbox" id="lightbox">

        <button class="close-button" id="closeLightbox"
                aria-label="Close image preview">×</button>

        <img id="lightboxImage" src="" alt="Enlarged gallery image">

    </div>

    <footer>
        <p>Created for Cognifyz Technologies Web Development Internship</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
